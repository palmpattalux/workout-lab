# Builds the Android app on every push to main. From the run's Artifacts:
# - "dotset-android": an .apk to install straight on an Android phone
# - "dotset-android-release": the signed .aab to upload to Google Play (only once the
#   ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are set)
name: Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: dotset-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Signed release bundle for Google Play
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.p12" ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: dotset-android-release
          path: android/app/build/outputs/bundle/release/app-release.aab
