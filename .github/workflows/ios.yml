# Builds the iPhone app on a Mac in GitHub's cloud, so no Mac or Xcode is needed.
# - On every push to main, and on pull requests: an unsigned test build, to catch breakage early.
# - Run it by hand (Actions > iPhone build > Run workflow) to sign it and upload it to App Store
#   Connect, where it shows up in TestFlight after Apple's processing. Needs these secrets:
#   APPLE_TEAM_ID (Membership details), and an App Store Connect team API key with the Admin role:
#   ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the whole text of the downloaded .p8 file).
# The build number is the run number, so every upload is newer than the last.
name: iPhone build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    env:
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Test build (unsigned)
        if: env.UPLOAD != 'true'
        working-directory: ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Check the Apple secrets
        if: env.UPLOAD == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        # Prints only yes/no checks and lengths. Writes a clean copy of the .p8 key for the next step.
        run: python3 -I .github/ios-key.py "$RUNNER_TEMP/AuthKey.p8"
      - name: Sign and upload to App Store Connect
        if: env.UPLOAD == 'true'
        working-directory: ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          BUILD: ${{ github.run_number }}
        run: |
          TEAM=$(printf '%s' "$TEAM" | tr -d '[:space:]')
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          ISSUER=$(printf '%s' "$ISSUER" | tr -d '[:space:]')
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          mv "$RUNNER_TEMP/AuthKey.p8" "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Dotset.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" "${AUTH[@]}"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dotset.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
