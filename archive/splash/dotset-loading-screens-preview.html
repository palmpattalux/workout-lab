<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dotset loading screens</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0d0d0d; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  .phone { position: relative; width: min(100vw, 430px); height: min(100dvh, 900px); background: #171717; overflow: hidden; }

  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .word { font: 700 100px "Montserrat", system-ui, sans-serif; fill: #fff; }
  .bar { position: absolute; z-index: 2; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; width: max-content; max-width: 94%; gap: 6px; padding: 5px; border-radius: 99px; background: rgba(255,255,255,.07); backdrop-filter: blur(8px); }
  .bar button { white-space: nowrap; border: 0; border-radius: 99px; padding: 9px 11px; font: 600 12px system-ui, sans-serif; color: #bbb; background: transparent; cursor: pointer; }
  #live { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; z-index: 1; background: #121514; }
  .bar button.on { background: #f0f2f0; color: #171717; }
</style>
</head>
<body>
<div class="phone" id="stage">
  <svg id="svg" aria-label="Dotset, loading">
    <defs><path id="ring" d="M0,-161 A161,161 0 1 1 0,161 A161,161 0 1 1 0,-161"/></defs>
    <g id="gA"></g><g id="gB"></g>
    <g id="dot"><circle cx="5" cy="6" r="70" fill="#c2c9d4"/><circle r="70" fill="#eff1ee"/></g>
    <text id="probe" class="word" x="-9999" y="-9999">DOTSET</text>
  </svg>
  <!-- 4 and 5 are the app's own opening screen (copied from index.html), shown over a mock home screen -->
  <iframe id="live" title="Opening screen"></iframe>
  <div class="bar">
    <button data-v="v1">1 · Tick</button>
    <button data-v="v2">2 · Whirlpool</button>
    <button data-v="v3">3 · Whirlpool + font</button>
    <button data-v="v4">4 · Dark, centred</button>
    <button data-v="v5">5 · Thin text</button>
    <button id="replay">Replay</button>
  </div>
</div>

  const gap = .25                              // space between words, in font sizes
  const F = (C / 6) / (w100 / 100 + gap)
  for (let i = 0; i < 6; i++) {
    const t = document.createElementNS(NS, 'text'); t.setAttribute('class', 'word'); t.style.fontSize = F + 'px'
    const tp = document.createElementNS(NS, 'textPath'); tp.setAttribute('href', '#ring')
    tp.setAttribute('startOffset', i * C / 6 + gap * F / 2); tp.textContent = 'DOTSET'
    t.appendChild(tp); (i < 3 ? gA : gB).appendChild(t)
