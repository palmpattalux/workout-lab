<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
    <style>
      /* opening screen: shows before the app's own code arrives */
      #splash { --sp-bg: #f3f4f2; --sp-ink: #1b201d; --sp-muted: #7a827c; --sp-sun: #ff9a1f; --sp-glow: rgba(255,154,31,.5); --sp-glow-soft: rgba(255,154,31,.22); position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--sp-bg); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
      :root[data-mode="dark"] #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(255,154,31,.65); }
      @media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(255,154,31,.65); } }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      /* Dotset: no rush. The dot appears and breathes, a ring settles around it to make the "o",
         then a soft sheet slides off the word: the letters were there all along. */
      .ds { position: relative; display: flex; align-items: baseline; font: 800 2.7rem/1 "Manrope", system-ui, sans-serif; letter-spacing: -.045em; color: var(--sp-ink); }
      .ds-o { position: relative; z-index: 2; display: inline-block; width: .56em; height: .56em; margin: 0 .035em; align-self: baseline; transform: translateY(.02em); }
      .ds-ring, .ds-dot { position: absolute; inset: 0; border-radius: 50%; }
      .ds-dot { background: var(--sp-sun); opacity: 0; transform: scale(.15);
        animation: ds-dot 1.1s cubic-bezier(.25,.6,.3,1) .2s forwards, ds-breathe 1.2s ease-in-out 1.3s forwards; }
      .ds-ring { border: .12em solid var(--sp-sun); opacity: 0; transform: scale(1.7); animation: ds-ring 1.1s cubic-bezier(.3,.6,.25,1) 1.05s forwards; }
      /* the sheet: page-coloured, feathered on its leading edge, drawn off to the right */
      .ds-sheet { position: absolute; z-index: 1; top: -.3em; bottom: -.3em; left: -1.2em; width: calc(100% + 2.4em); pointer-events: none;
        background: linear-gradient(90deg, transparent, var(--sp-bg) 1.1em); animation: ds-sheet 1.7s cubic-bezier(.55,0,.25,1) 2s forwards; }
      .ds.lit .ds-ring { box-shadow: 0 0 12px var(--sp-glow-soft); transition: box-shadow 1.2s ease; }
      @keyframes ds-dot { 0% { opacity: 0; transform: scale(.15); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(.62); } }
      @keyframes ds-breathe { 0% { transform: scale(.62); } 50% { transform: scale(.5); } 100% { transform: scale(.32); } }
      @keyframes ds-ring { 0% { opacity: 0; transform: scale(1.7); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes ds-sheet { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { .ds, .ds * { animation-duration: .01s !important; animation-delay: 0s !important; } }
    </style>
    <script>
      // apply the saved light/dark choice before anything paints
      try { var t = JSON.parse(localStorage.getItem('workout-lab:prefs') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-mode', t) } catch (e) {}
      // iPhone/iPad Safari (not the store app, not added to the home screen): Safari's own bars float over
      // the bottom of the page, so the app is lifted clear of them (see data-ios-web in styles.css)
      try {
        var ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
        var app = navigator.standalone || (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
        if (ios && !app) document.documentElement.setAttribute('data-ios-web', '')
      } catch (e) {}
    </script>
    <title>Dotset</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Opening screen (first load only). To remove it: delete this block, the splash <style>, and hideSplash() in src/main.tsx. -->
    <div id="splash" aria-label="Dotset, loading">
      <div class="ds" aria-hidden="true"><span>D</span><span class="ds-o"><i class="ds-ring"></i><i class="ds-dot"></i></span><span>tset</span><i class="ds-sheet"></i></div>
    </div>
    <script>
      setTimeout(function () { var w = document.querySelector('.ds'); if (w) w.classList.add('lit') }, 3500)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
