<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* opening screen: shows before the app's own code arrives */
      #splash { --sp-bg: #f3f4f2; --sp-ink: #1b201d; --sp-muted: #7a827c; --sp-sun: #ff9a1f; --sp-glow: rgba(255,154,31,.5); --sp-glow-soft: rgba(255,154,31,.22); position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--sp-bg); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
      :root[data-mode="dark"] #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(255,154,31,.65); }
      @media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(255,154,31,.65); } }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      /* Dotset: a dot drops in and taps three times (three sets), then opens into the "o" and the name slides out of it */
      .ds { position: relative; display: flex; align-items: baseline; font: 800 2.7rem/1 "Manrope", system-ui, sans-serif; letter-spacing: -.045em; color: var(--sp-ink);
        transform: translateX(var(--shift, 0px)); animation: ds-center .55s cubic-bezier(.2,.8,.2,1) 1.7s forwards; }
      .ds-o { position: relative; display: inline-block; width: .56em; height: .56em; margin: 0 .035em; align-self: baseline; transform: translateY(.02em); }
      .ds-ring, .ds-dot, .ds-o::after { position: absolute; inset: 0; border-radius: 50%; }
      .ds-ring { border: .12em solid var(--sp-sun); transform: scale(0); animation: ds-ring .45s cubic-bezier(.3,1.4,.5,1) 1.42s forwards; }
      .ds-dot { background: var(--sp-sun); transform: translateY(-1.6em) scale(.7); opacity: 0;
        animation: ds-drop .5s cubic-bezier(.3,0,.6,1) .15s forwards, ds-tap .24s ease-in-out .68s 3 forwards, ds-shrink .45s cubic-bezier(.2,.8,.2,1) 1.42s forwards; }
      .ds-o::after { content: ""; border: 2px solid var(--sp-sun); opacity: 0; animation: ds-ripple .24s ease-out .72s 3; }
      .ds-l, .ds-r { display: inline-block; opacity: 0; }
      .ds-l { transform: translateX(.3em); animation: ds-out .5s cubic-bezier(.2,.8,.2,1) 1.7s forwards; }
      .ds-r { transform: translateX(-.35em); animation: ds-out .5s cubic-bezier(.2,.8,.2,1) 1.76s forwards; }
      .ds.lit .ds-ring { box-shadow: 0 0 14px var(--sp-glow), inset 0 0 10px var(--sp-glow-soft); transition: box-shadow .5s ease; }
      @keyframes ds-drop { 0% { opacity: 1; transform: translateY(-1.6em) scale(.55, .8); } 75% { transform: translateY(0) scale(.6, .6); } 85% { transform: translateY(0) scale(.72, .48); } 100% { opacity: 1; transform: translateY(0) scale(.6); } }
      @keyframes ds-tap { 0%, 100% { transform: scale(.6); } 35% { transform: scale(.46); } }
      @keyframes ds-shrink { from { transform: scale(.6); opacity: 1; } to { transform: scale(.3); opacity: 1; } }
      @keyframes ds-ring { to { transform: scale(1); } }
      @keyframes ds-ripple { from { opacity: .7; transform: scale(.6); } to { opacity: 0; transform: scale(2.1); } }
      @keyframes ds-out { to { opacity: 1; transform: translateX(0); } }
      @keyframes ds-center { to { transform: translateX(0); } }
      @media (prefers-reduced-motion: reduce) { .ds, .ds * , .ds-o::after { animation-duration: .01s !important; animation-delay: 0s !important; } }
    </style>
    <script>
      // apply the saved light/dark choice before anything paints
      try { var t = JSON.parse(localStorage.getItem('workout-lab:prefs') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-mode', t) } catch (e) {}
    </script>
    <title>Dotset</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Opening screen (first load only). To remove it: delete this block, the splash <style>, and hideSplash() in src/main.tsx. -->
    <div id="splash" aria-label="Dotset, loading">
      <div class="ds" aria-hidden="true"><span class="ds-l">D</span><span class="ds-o"><i class="ds-ring"></i><i class="ds-dot"></i></span><span class="ds-r">tset</span></div>
    </div>
    <script>
      // start with the "o" in the middle of the screen; the word slides to centre as its letters come out
      (function () {
        var w = document.querySelector('.ds'), o = document.querySelector('.ds-o')
        if (!w || !o) return
        function measure() {
          var wr = w.getBoundingClientRect(), or = o.getBoundingClientRect(), now = parseFloat(getComputedStyle(w).getPropertyValue('--shift')) || 0
          w.style.setProperty('--shift', (now + (wr.left + wr.width / 2) - (or.left + or.width / 2)) + 'px')
        }
        measure()
        if (document.fonts) document.fonts.ready.then(function () { if (performance.now() < 1600) { w.style.setProperty('--shift', '0px'); w.style.transform = 'none'; measure(); w.style.transform = '' } })
        setTimeout(function () { w.classList.add('lit') }, 1850)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
