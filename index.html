<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* opening screen: shows before the app's own code arrives */
      #splash { --sp-bg: #f3f4f2; --sp-ink: #1b201d; --sp-muted: #7a827c; --sp-sun: #ff9a1f; --sp-glow: rgba(255,154,31,.55); position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--sp-bg); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
      :root[data-mode="dark"] #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(255,154,31,.65); }
      @media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(255,154,31,.65); } }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .rn { display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: "Manrope", system-ui, sans-serif; color: var(--sp-ink); }
      .rn-name { font-weight: 800; font-size: 2.1rem; letter-spacing: -.045em; animation: rn-in .7s cubic-bezier(.2,.8,.2,1) .2s both; }
      .rn-num { position: relative; display: flex; font-weight: 800; font-size: 3.6rem; line-height: 1.15; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--sp-muted);
        animation: rn-rise .6s cubic-bezier(.2,.8,.2,1) .45s both, rn-ink .3s ease 1.35s forwards, rn-glow .9s ease-out 1.6s forwards; }
      .rn-slot { position: relative; display: inline-block; height: 1.15em; clip-path: inset(.2em -.1em .17em -.1em); }
      .rn-slot span { display: block; animation: rn-roll-out .4s cubic-bezier(.5,0,.2,1) 1.3s forwards; }
      .rn-slot .a { animation-name: rn-roll-out; }
      .rn-slot .b { position: absolute; left: 0; top: 100%; opacity: 0; animation-name: rn-roll-in; }
      .rn-plus { position: absolute; left: 100%; top: 0; margin-left: 8px; color: var(--sp-ink); opacity: 0; animation: rn-plus .75s cubic-bezier(.3,.7,.3,1) .85s forwards; }
      @keyframes rn-in { from { opacity: 0; transform: translateY(6px); filter: blur(6px); } }
      @keyframes rn-rise { from { opacity: 0; transform: translateY(8px); } }
      @keyframes rn-ink { to { color: var(--sp-sun); } }
      @keyframes rn-roll-out { to { transform: translateY(-100%); opacity: 0; } }
      @keyframes rn-roll-in { to { transform: translateY(-100%); opacity: 1; } }
      @keyframes rn-plus { 0% { opacity: 0; transform: translateX(36px); } 45% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(-2.6em) scale(.7); } }
      @keyframes rn-glow {
        0% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); }
        30% { transform: scale(1.12); filter: drop-shadow(0 0 12px var(--sp-glow)) drop-shadow(0 0 30px var(--sp-glow)); }
        100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255,154,31,.25)); }
      }
      @media (prefers-reduced-motion: reduce) { .rn-name, .rn-num, .rn-slot span, .rn-plus { animation: none; } .rn-slot span { transform: translateY(-100%); } .rn-slot .b { opacity: 1; } .rn-num { color: var(--sp-sun); } }
    </style>
    <script>
      // apply the saved light/dark choice before anything paints
      try { var t = JSON.parse(localStorage.getItem('workout-lab:prefs') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-mode', t) } catch (e) {}
    </script>
    <title>Right Now</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Opening screen (first load only). To remove it: delete this block, the splash <style>, and hideSplash() in src/main.tsx. -->
    <div id="splash" aria-label="Right Now, loading">
      <div class="rn">
        <div class="rn-num" aria-hidden="true">1<span class="rn-slot"><span class="a">00</span><span class="b">20</span></span>%<span class="rn-plus">20</span></div>
        <div class="rn-name">Right Now</div>
      </div>
    </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
