<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* opening screen: shows before the app's own code arrives */
      #splash { --sp-bg: #f3f4f2; --sp-ink: #1b201d; position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--sp-bg); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
      :root[data-mode="dark"] #splash { --sp-bg: #121514; --sp-ink: #e9ece9; }
      @media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) #splash { --sp-bg: #121514; --sp-ink: #e9ece9; } }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .sp-brand { display: flex; align-items: center; gap: 10px; }
      .sp-word { font: 800 2.6rem "Manrope", system-ui, sans-serif; letter-spacing: -.045em; color: var(--sp-ink); animation: sp-word .8s cubic-bezier(.2,.8,.2,1) .2s both; }
      #splash .sp-flower { width: 52px; height: 52px; overflow: visible; stroke: var(--sp-ink); stroke-width: 1.5; stroke-linejoin: round; }
      .sp-bloom { transform-box: view-box; transform-origin: 32px 24px; animation: sp-turn 6s ease-in-out 1.5s infinite; }
      .p { transform-box: view-box; transform-origin: 32px 24px; transform: scale(0) rotate(-30deg); animation: sp-pop .8s cubic-bezier(.3,1.35,.5,1) forwards; }
      .p.o { fill: var(--sp-bg); }
      .p.i { fill: color-mix(in srgb, var(--sp-ink) 12%, var(--sp-bg)); }
      .sp-core { fill: var(--sp-ink); stroke: none; transform-box: fill-box; transform-origin: center; transform: scale(0); animation: sp-core .45s cubic-bezier(.3,1.6,.5,1) 1.15s forwards; }
      @keyframes sp-pop { to { transform: scale(1) rotate(0); } }
      @keyframes sp-core { to { transform: scale(1); } }
      @keyframes sp-word { from { opacity: 0; transform: translateX(14px); filter: blur(4px); } }
      @keyframes sp-turn { 0%, 100% { transform: rotate(-4deg) scale(1); } 50% { transform: rotate(4deg) scale(1.03); } }
      @media (prefers-reduced-motion: reduce) { .p, .sp-core, .sp-word, .sp-bloom { animation: none; transform: none; } }
    </style>
    <script>
      // apply the saved light/dark choice before anything paints
      try { var t = JSON.parse(localStorage.getItem('workout-lab:prefs') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-mode', t) } catch (e) {}
    </script>
    <title>Lipstick</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Opening screen (first load only). To remove it: delete this block, the splash <style>, and hideSplash() in src/main.tsx. -->
    <div id="splash" aria-label="Lipstick, loading">
      <div class="sp-brand">
        <span class="sp-word">Lipstick</span>
        <svg class="sp-flower" viewBox="10 2 44 44" aria-hidden="true">
          <g class="sp-bloom"><g transform="rotate(0 32 24)"><ellipse class="p o" style="animation-delay:0.25s" cx="32" cy="13.5" rx="6.2" ry="10.5"/></g><g transform="rotate(45 32 24)"><ellipse class="p o" style="animation-delay:0.30s" cx="32" cy="13.5" rx="6.2" ry="10.5"/></g><g transform="rotate(90 32 24)"><ellipse class="p o" style="animation-delay:0.35s" cx="32" cy="13.5" rx="6.2" ry="10.5"/></g><g transform="rotate(135 32 24)"><ellipse class="p o" style="animation-delay:0.40s" cx="32" cy="13.5" rx="6.2" ry="10.5"/></g><g transform="rotate(180 32 24)"><ellipse class="p o" style="animation-delay:0.45s" cx="32" cy="13.5" rx="6.2" ry="10.5"/></g><g transform="rotate(225 32 24)"><ellipse class="p o" style="animation-delay:0.50s" cx="32" cy="13.5" rx="6.2" ry="10.5"/></g><g transform="rotate(270 32 24)"><ellipse class="p o" style="animation-delay:0.55s" cx="32" cy="13.5" rx="6.2" ry="10.5"/></g><g transform="rotate(315 32 24)"><ellipse class="p o" style="animation-delay:0.60s" cx="32" cy="13.5" rx="6.2" ry="10.5"/></g><g transform="rotate(36 32 24)"><ellipse class="p i" style="animation-delay:0.65s" cx="32" cy="17.5" rx="4.2" ry="7"/></g><g transform="rotate(108 32 24)"><ellipse class="p i" style="animation-delay:0.71s" cx="32" cy="17.5" rx="4.2" ry="7"/></g><g transform="rotate(180 32 24)"><ellipse class="p i" style="animation-delay:0.77s" cx="32" cy="17.5" rx="4.2" ry="7"/></g><g transform="rotate(252 32 24)"><ellipse class="p i" style="animation-delay:0.83s" cx="32" cy="17.5" rx="4.2" ry="7"/></g><g transform="rotate(324 32 24)"><ellipse class="p i" style="animation-delay:0.89s" cx="32" cy="17.5" rx="4.2" ry="7"/></g><circle class="sp-core" cx="32" cy="24" r="3.6"/></g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
