<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
    <style>
      /* opening screen: shows before the app's own code arrives */
      #splash { --sp-bg: #f3f4f2; --sp-ink: #1b201d; --sp-muted: #7a827c; --sp-sun: #c8ff57; --sp-glow: rgba(200,255,87,.55); --sp-glow-soft: rgba(200,255,87,.28); position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--sp-bg); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
      :root[data-mode="dark"] #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(200,255,87,.6); }
      @media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(200,255,87,.6); } }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      /* Dotset opening: the new swirl logo. Two lime arcs with tapering tails turn against each other,
         the inner one breathing in and out, then the name and a quiet line fade in beneath. */
      .ds { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1.8rem; color: var(--sp-ink); }
      .ds-mark { position: relative; width: 7rem; height: 7rem; opacity: 0; animation: ds-fade 1s ease-out .2s forwards; }
      .ds-arc { position: absolute; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg, var(--sp-sun) 250deg, transparent 340deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--w)), #000 calc(100% - var(--w) + 1px)); mask: radial-gradient(farthest-side, transparent calc(100% - var(--w)), #000 calc(100% - var(--w) + 1px)); }
      .ds-out { inset: 0; --w: .62rem; animation: ds-spin 3.4s cubic-bezier(.45,.1,.35,.95) infinite; }
      .ds-in { inset: 17%; --w: .42rem; animation: ds-spin-r 3.4s cubic-bezier(.45,.1,.35,.95) infinite, ds-breathe 3.4s ease-in-out infinite; }
      .ds-name { font: 800 2.1rem/1 "Manrope", system-ui, sans-serif; letter-spacing: -.04em; opacity: 0; transform: translateY(.4rem); animation: ds-up 1s ease-out 1.6s forwards; }
      .ds-line { margin-top: -.9rem; font: 500 .82rem/1 "Manrope", system-ui, sans-serif; letter-spacing: .06em; color: var(--sp-muted); opacity: 0; animation: ds-up 1s ease-out 2.1s forwards; }
      @keyframes ds-fade { to { opacity: 1; } }
      @keyframes ds-spin { to { transform: rotate(360deg); } }
      @keyframes ds-spin-r { to { transform: rotate(-360deg); } }
      @keyframes ds-breathe { 0%, 100% { scale: 1; } 50% { scale: .72; } }
      @keyframes ds-up { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .ds, .ds * { animation-duration: .01s !important; animation-delay: 0s !important; } }
    </style>
    <script>
      // apply the saved light/dark choice before anything paints
      try { var t = JSON.parse(localStorage.getItem('workout-lab:prefs') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-mode', t) } catch (e) {}
      // iPhone/iPad Safari (not the store app, not added to the home screen): Safari's own bars float over
      // the bottom of the page, so the app is lifted clear of them (see data-ios-web in styles.css)
      try {
        var ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
        var app = navigator.standalone || (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
        if (ios && !app) document.documentElement.setAttribute('data-ios-web', '')
      } catch (e) {}
    </script>
    <title>Dotset</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Opening screen (first load only). To remove it: delete this block, the splash <style>, and hideSplash() in src/main.tsx. -->
    <div id="splash" aria-label="Dotset, loading">
      <div class="ds" aria-hidden="true">
        <div class="ds-mark"><i class="ds-arc ds-out"></i><i class="ds-arc ds-in"></i></div>
        <div class="ds-name">Dotset</div>
        <div class="ds-line">Every set, remembered.</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
