<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap" rel="stylesheet" />
    <style>
      /* opening screen: shows before the app's own code arrives */
      #splash { --sp-bg: #f3f4f2; --sp-ink: #1b201d; --sp-muted: #7a827c; --sp-sun: #c8ff57; --sp-glow: rgba(200,255,87,.55); --sp-glow-soft: rgba(200,255,87,.28); position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--sp-bg); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
      :root[data-mode="dark"] #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(200,255,87,.6); }
      @media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(200,255,87,.6); } }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      /* Dotset opening: the app icon assembles slowly. A soft glow wakes up, the orange dot appears and
         breathes, a ring draws itself around it, then the name and a quiet line fade in beneath. */
      .ds { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1.6rem; color: var(--sp-ink); }
      .ds-mark { position: relative; width: 6.4rem; height: 6.4rem; display: grid; place-items: center; }
      .ds-halo { position: absolute; inset: -45%; border-radius: 50%; background: radial-gradient(closest-side, var(--sp-glow-soft), transparent 70%); opacity: 0; animation: ds-halo 2.4s ease-out .1s forwards; }
      .ds-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
      .ds-ring circle { fill: none; stroke-linecap: round; }
      .ds-track { stroke: var(--sp-ink); stroke-width: 3; opacity: .09; }
      .ds-arc { stroke: var(--sp-ink); stroke-width: 3; stroke-dasharray: 1; stroke-dashoffset: 1; animation: ds-arc 1.9s cubic-bezier(.45,.05,.25,1) 1.05s forwards; }
      .ds-dot { position: relative; width: 38%; height: 38%; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #eaff9c, var(--sp-sun) 58%, #a9e62e); box-shadow: 0 0 22px var(--sp-glow-soft); opacity: 0; transform: scale(.2); animation: ds-dot 1.1s cubic-bezier(.25,.6,.3,1) .25s forwards, ds-breathe 3.2s ease-in-out 1.4s infinite; }
      .ds-name { font: 800 2.1rem/1 "Manrope", system-ui, sans-serif; letter-spacing: -.04em; opacity: 0; transform: translateY(.4rem); animation: ds-up 1s ease-out 2.2s forwards; }
      .ds-line { margin-top: -.9rem; font: 500 .82rem/1 "Manrope", system-ui, sans-serif; letter-spacing: .06em; color: var(--sp-muted); opacity: 0; animation: ds-up 1s ease-out 2.7s forwards; }
      @keyframes ds-halo { to { opacity: 1; } }
      @keyframes ds-arc { to { stroke-dashoffset: 0; } }
      @keyframes ds-dot { to { opacity: 1; transform: scale(1); } }
      @keyframes ds-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(.88); } }
      @keyframes ds-up { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .ds, .ds *, .ds-dot { animation-duration: .01s !important; animation-delay: 0s !important; } }
    </style>
    <script>
      // apply the saved light/dark choice before anything paints
      try { var t = JSON.parse(localStorage.getItem('workout-lab:prefs') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-mode', t) } catch (e) {}
      // iPhone/iPad Safari (not the store app, not added to the home screen): Safari's own bars float over
      // the bottom of the page, so the app is lifted clear of them (see data-ios-web in styles.css)
      try {
        var ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
        var app = navigator.standalone || (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
        if (ios && !app) document.documentElement.setAttribute('data-ios-web', '')
      } catch (e) {}
    </script>
    <title>Dotset</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Opening screen (first load only). To remove it: delete this block, the splash <style>, and hideSplash() in src/main.tsx. -->
    <div id="splash" aria-label="Dotset, loading">
      <div class="ds" aria-hidden="true">
        <div class="ds-mark"><i class="ds-halo"></i>
          <svg class="ds-ring" viewBox="0 0 100 100"><circle class="ds-track" cx="50" cy="50" r="48.5"/><circle class="ds-arc" cx="50" cy="50" r="48.5" pathLength="1"/></svg>
          <i class="ds-dot"></i></div>
        <div class="ds-name">Dotset</div>
        <div class="ds-line">Every set, remembered.</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
