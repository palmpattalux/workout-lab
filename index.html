<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* opening screen: shows before the app's own code arrives */
      #splash { --sp-bg: #f3f4f2; --sp-ink: #1b201d; --sp-muted: #7a827c; --sp-sun: #ff9a1f; --sp-glow: rgba(255,154,31,.5); --sp-glow-soft: rgba(255,154,31,.22); position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--sp-bg); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
      :root[data-mode="dark"] #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(255,154,31,.65); }
      @media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) #splash { --sp-bg: #121514; --sp-ink: #e9ece9; --sp-muted: #868f89; --sp-glow: rgba(255,154,31,.65); } }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .rn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: "Manrope", system-ui, sans-serif; color: var(--sp-ink); animation: rn-in .5s cubic-bezier(.2,.8,.2,1) .05s both; }
      .rn-num { font-weight: 800; font-size: 3.4rem; line-height: 1.1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
      .rn-name { font-weight: 800; font-size: 2rem; line-height: 1.1; letter-spacing: -.045em; }
      .rn-val { position: relative; display: inline-flex; }
      .rn-count { display: inline-flex; justify-content: flex-end; min-width: 3ch; }
      .rn-glow { position: relative; display: inline-block; transition: color .3s ease; }
      .rn.hit .rn-glow { color: transparent; }
      .rn-val.rn-glow::after { text-align: right; white-space: nowrap; }
      /* the orange layer sits on top and fades in, so ink never muddies into brown */
      .rn-glow::after { content: attr(data-text); position: absolute; inset: 0; color: var(--sp-sun); opacity: 0; text-shadow: 0 0 0 transparent; transition: opacity .2s ease, text-shadow .4s ease; }
      .rn.hit { animation: rn-pulse .7s cubic-bezier(.2,.8,.2,1); }
      .rn.hit .rn-glow::after { opacity: 1; text-shadow: 0 0 14px var(--sp-glow), 0 0 32px var(--sp-glow); animation: rn-settle 1s ease-out .35s forwards; }
      @keyframes rn-in { from { opacity: 0; transform: translateY(6px); } }
      @keyframes rn-pulse { 40% { transform: scale(1.035); } }
      @keyframes rn-settle { to { text-shadow: 0 0 10px var(--sp-glow-soft), 0 0 0 transparent; } }
      @media (prefers-reduced-motion: reduce) { .rn, .rn.hit, .rn.hit .rn-glow::after { animation: none; } }
    </style>
    <script>
      // apply the saved light/dark choice before anything paints
      try { var t = JSON.parse(localStorage.getItem('workout-lab:prefs') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-mode', t) } catch (e) {}
    </script>
    <title>Sidekick</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Opening screen (first load only). To remove it: delete this block, the splash <style>, and hideSplash() in src/main.tsx. -->
    <div id="splash" aria-label="Sidekick, loading">
      <div class="rn">
        <div class="rn-num" aria-hidden="true"><span class="rn-val rn-glow" data-text="100%"><span class="rn-count">0</span>%</span></div>
        <div class="rn-name rn-glow" data-text="Sidekick">Sidekick</div>
      </div>
    </div>
    <script>
      // count 0 → 100 with a smooth ease-out; at 100 the number and the name turn orange and glow together
      (function () {
        var rn = document.querySelector('.rn'), count = document.querySelector('.rn-count')
        if (!count) return
        var START = 300, DUR = 1000, t0 = performance.now()
        function frame(now) {
          var k = Math.min(1, Math.max(0, (now - t0 - START) / DUR))
          count.textContent = Math.round(100 * (1 - Math.pow(1 - k, 3)))
          if (k < 1) return requestAnimationFrame(frame)
          rn.classList.add('hit')
        }
        requestAnimationFrame(frame)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
